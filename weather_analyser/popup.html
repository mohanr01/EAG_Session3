<!DOCTYPE html>
<html>
<head>
  <title>Temperature Monitor</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h2>Temperature Monitor</h2>
    <form id="monitorForm">
      <div class="form-group">
        <label for="country">State:</label>
        <select id="country" required>
          <option value="Tamil Nadu">Tamil Nadu</option>
          <option value="Kerela">Kerela</option>
          <option value="Andhra Pradesh">Andhra Pradesh</option>
          <option value="Delhi">Delhi</option>
        </select>
      </div>
      
      <div class="form-group">
        <label for="targetRate">Temperature (Celsius):</label>
        <input type="number" id="targetRate" step="0.01" required>
      </div>

      <div class="form-group">
        <label for="email">Email for Notifications:</label>
        <input type="email" id="email" required>
      </div>

      <div class="form-group">
        <label for="checkInterval">Check Interval (minutes):</label>
        <select id="checkInterval">
          <option value="5">5 minutes</option>
          <option value="15">15 minutes</option>
          <option value="30">30 minutes</option>
          <option value="60">1 hour</option>
        </select>
      </div>

      <button type="submit" id="startMonitoring">Start Monitoring</button>
    </form>

    <div id="status" class="status">
      <p>Current Status: <span id="monitoringStatus">Not Monitoring</span></p>
      <p>Current Temperature: <span id="currentRate">--</span></p>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
